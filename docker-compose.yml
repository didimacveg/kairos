# KAIROS OS — Fase 1
# Principio: ningun puerto se publica fuera de loopback. Para exponer a la LAN
# se edita explicitamente aqui, nunca por defecto.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    container_name: kairos-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # GPU NVIDIA. Requiere NVIDIA Container Toolkit (en Windows: dentro de WSL2).
    # Comenta este bloque entero si arrancas en CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    container_name: kairos-core
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      KAIROS_OLLAMA_URL: http://ollama:11434
      KAIROS_BIND_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/core:/app:ro
      - corestate:/var/lib/kairos
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: kairos-web
    restart: unless-stopped
    environment:
      KAIROS_CORE_URL: http://core:8000
    depends_on:
      - core
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  ollama:
  corestate:
