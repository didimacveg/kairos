# KAIROS OS — Fase 1
# Principio: ningun puerto se publica fuera de loopback. Para exponer a la LAN
# se edita explicitamente aqui, nunca por defecto.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kairos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:latest
    container_name: kairos-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # GPU NVIDIA. Requiere NVIDIA Container Toolkit (en Windows: dentro de WSL2).
    # Comenta este bloque entero si arrancas en CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  voice:
    build:
      context: .
      dockerfile: docker/voice.Dockerfile
    container_name: kairos-voice
    restart: unless-stopped
    environment:
      KAIROS_WHISPER_MODEL: ${KAIROS_WHISPER_MODEL:-medium}
      KAIROS_WHISPER_DEVICE: ${KAIROS_WHISPER_DEVICE:-cuda}
      KAIROS_WHISPER_COMPUTE: ${KAIROS_WHISPER_COMPUTE:-int8_float16}
      KAIROS_WHISPER_LANGUAGE: ${KAIROS_WHISPER_LANGUAGE:-es}
      KAIROS_ELEVENLABS_KEY: ${KAIROS_ELEVENLABS_KEY:-}
      KAIROS_ELEVENLABS_LIMITE: ${KAIROS_ELEVENLABS_LIMITE:-9000}
      KAIROS_ELEVENLABS_VOICE: ${KAIROS_ELEVENLABS_VOICE:-}
      KAIROS_ELEVENLABS_MODEL: ${KAIROS_ELEVENLABS_MODEL:-eleven_flash_v2_5}
      KAIROS_ELEVENLABS_STABILITY: ${KAIROS_ELEVENLABS_STABILITY:-0.55}
      KAIROS_ELEVENLABS_SIMILARITY: ${KAIROS_ELEVENLABS_SIMILARITY:-0.80}
      KAIROS_ELEVENLABS_STYLE: ${KAIROS_ELEVENLABS_STYLE:-0.35}
      KAIROS_DEEPGRAM_KEY: ${KAIROS_DEEPGRAM_KEY:-}
      KAIROS_DEEPGRAM_STT: ${KAIROS_DEEPGRAM_STT:-nova-3}
      KAIROS_DEEPGRAM_TTS: ${KAIROS_DEEPGRAM_TTS:-aura-2-nestor-es}
      KAIROS_DEEPGRAM_LANG: ${KAIROS_DEEPGRAM_LANG:-es}
      KAIROS_PIPER_VOICE: ${KAIROS_PIPER_VOICE:-es_ES-sharvard-medium}
      KAIROS_PIPER_VOICE_EN: ${KAIROS_PIPER_VOICE_EN:-en_US-ryan-medium}
      KAIROS_PIPER_PITCH: ${KAIROS_PIPER_PITCH:-0.90}
      KAIROS_PIPER_LENGTH_SCALE: ${KAIROS_PIPER_LENGTH_SCALE:-1.08}
      KAIROS_WHISPER_MIN_LOGPROB: ${KAIROS_WHISPER_MIN_LOGPROB:--0.9}
    volumes:
      # Sin esto, `restart voice` relanza la imagen construida y los
      # cambios en disco no llegan nunca. Costo tres parches inutiles.
      - ./apps/voice:/app:ro
      - whisper:/var/lib/kairos/models
    # Sin `ports`: solo accesible desde la red interna de Docker.
    # Sin GPU: Whisper corre en CPU para dejar la VRAM entera al modelo de
    # razonamiento. Transcribir es una rafaga; razonar es el bucle principal.
    security_opt:
      - no-new-privileges:true

  forge:
    build:
      context: .
      dockerfile: docker/forge.Dockerfile
    container_name: kairos-forge
    restart: unless-stopped
    environment:
      KAIROS_FORGE_TOKEN: ${KAIROS_FORGE_TOKEN:-}
      KAIROS_FORGE_NO_NET: "si"
    volumes:
      # El repositorio en SOLO LECTURA. El forge clona a un temporal; el
      # original no es escribible desde dentro pase lo que pase.
      - .:/repo:ro
      - forgework:/var/lib/kairos/forge
    # Red INTERNA, no "ninguna". `network_mode: none` le quitaba tambien la
    # red de Docker, asi que el nucleo no podia ni hablarle. Una red marcada
    # `internal: true` deja pasar el trafico entre contenedores y bloquea la
    # salida a Internet, que era el objetivo real.
    networks:
      - aislada
    read_only: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512

  warden:
    build:
      context: .
      dockerfile: docker/warden.Dockerfile
    container_name: kairos-warden
    restart: unless-stopped
    environment:
      KAIROS_WARDEN_TOKEN: ${KAIROS_WARDEN_TOKEN:-}
      KAIROS_WARDEN_MAIN: ${KAIROS_WARDEN_MAIN:-main}
    volumes:
      # LECTURA Y ESCRITURA. Es el unico servicio con este permiso, y por eso
      # solo sabe hacer cuatro cosas y exige propuesta aprobada.
      - .:/repo
    networks:
      - aislada
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g

  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
    container_name: kairos-core
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      KAIROS_OLLAMA_URL: http://ollama:11434
      KAIROS_VOICE_URL: http://voice:8100
      KAIROS_BIND_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/core:/app:ro
      # El repositorio en SOLO LECTURA: Smith lee su propio codigo
      # para proponerse cambios, pero no puede escribir en el.
      - .:/repo:ro
      - corestate:/var/lib/kairos
      - adjuntos:/var/lib/kairos/attachments
    networks:
      - default
      - aislada
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: kairos-web
    restart: unless-stopped
    environment:
      KAIROS_CORE_URL: http://core:8000
    depends_on:
      - core
    volumes:
      # Sin esto, la imagen lleva una copia congelada del frontend y los
      # cambios en disco no llegan nunca al contenedor. `next dev` recarga
      # en caliente solo si ve los ficheros reales.
      - ./apps/web/app:/app/app
      - ./apps/web/components:/app/components
      - ./apps/web/lib:/app/lib
      - ./apps/web/next.config.mjs:/app/next.config.mjs
    ports:
      # ${KAIROS_WEB_BIND} decide quien puede llegar:
      #   127.0.0.1  solo esta maquina (por defecto, lo mas seguro)
      #   0.0.0.0    tambien la red privada, para el movil
      # Con 0.0.0.0, quien protege es el cortafuegos de Windows: la regla solo
      # permite el rango de Tailscale, no toda la WiFi.
      - "${KAIROS_WEB_BIND:-127.0.0.1}:3000:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  forgework:
  adjuntos:
  whisper:
  pgdata:
  ollama:
  corestate:

networks:
  # Sin salida a Internet. Los contenedores se ven entre si; el exterior no
  # existe para ellos.
  aislada:
    internal: true
  default:
